<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asmodensius Creature #1: Dome replay viewer</title>
<meta name="description" content="Interactive replay of recorded headless runs of Creature #1 (frozen Combo A). The browser replays numbers only; no creature code runs here.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23ffaa44%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="viewer.css">
</head><body>
<header id="top">
  <a href="../index.html" class="muted" style="text-decoration:none">← site</a>
  <div class="brand"><b>Creature #1</b> <span class="muted">Dome replay</span></div>
  <div class="row">
    <label>Run <select id="runA" aria-label="run"></select></label>
    <label class="cmp"><input type="checkbox" id="cmpOn"> compare with <select id="runB" aria-label="compare run" disabled></select></label>
  </div>
</header>
<main id="main">
  <section id="stage">
    <div class="pane" id="paneA"><canvas id="cvA"></canvas><div class="tag" id="tagA"></div></div>
    <div class="pane hidden" id="paneB"><canvas id="cvB"></canvas><div class="tag" id="tagB"></div></div>
    <div id="hint">drag to pan · wheel or pinch to zoom · tap a creature to inspect</div>
  </section>
  <aside id="side">
    <div id="transport">
      <button id="bBack" title="step back (←)">⏮</button><button id="bPlay" title="play/pause (space)">▶</button><button id="bFwd" title="step forward (→)">⏭</button>
      <label class="speed">speed <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>8</option><option>16</option></select>×</label>
      <button id="bFit" title="reset view">fit</button>
    </div>
    <input id="scrub" type="range" min="0" max="0" value="0" aria-label="time">
    <div id="clock" class="mono"></div>
    <details open><summary>Overlays</summary><div id="ovl" class="grid2"></div></details>
    <details open><summary>Inspector <span id="selName" class="muted"></span></summary>
      <div id="insp" class="mono small">Tap a creature.</div>
      <div class="row small">chart <select id="sig"></select> <button id="addSig">+ add</button></div>
      <div id="charts"></div>
    </details>
    <details><summary>About this data</summary><div id="about" class="small"></div></details>
  </aside>
</main>
<script src="viewer.js"></script>
</body></html>
