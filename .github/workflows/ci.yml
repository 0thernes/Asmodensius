name: ci
# Creature #1 organism checks. No remote exists yet (no push without grade A and Alex's OK), so this has not run on GitHub;
# every step is run on the box first.
on: [push, pull_request]
jobs:
  organism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # identity gate builds the frozen pin bc6ad6a for its goldens
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: bun install --frozen-lockfile
      - name: Identity gate (Combo A 540-543 bit-identical to frozen output; smoke trajectory)
        run: bash creatures/001/specialists/tools/identity_gate.sh HEAD
      - name: Lab smoke (Moonlab dice)
        run: bun lab/smoke10.ts dice
      - name: Conformance + originality
        run: bun lab/conformance/run.ts
      - name: Typecheck (known failures, audit F40; not yet blocking)
        run: npx tsc -p tsconfig.json
        continue-on-error: true
